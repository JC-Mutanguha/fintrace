<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Open FinTrace on your phone</title>
    <style>
      * { box-sizing: border-box; }
      body {
        font-family: system-ui, sans-serif;
        display: flex;
        min-height: 100vh;
        margin: 0;
        align-items: center;
        justify-content: center;
        background: #115637;
        color: #fff;
      }
      main {
        text-align: center;
        padding: 2rem;
        max-width: 24rem;
      }
      .card {
        background: #fff;
        color: #111;
        border-radius: 16px;
        padding: 1.5rem;
        margin-top: 1rem;
      }
      img {
        width: 100%;
        max-width: 260px;
        height: auto;
        display: block;
        margin: 0 auto;
      }
      a {
        color: #115637;
        font-weight: 600;
        word-break: break-all;
      }
      p { line-height: 1.5; margin: 0.5rem 0; }
      .hint { font-size: 0.9rem; opacity: 0.9; }
    </style>
  </head>
  <body>
    <main>
      <h1>FinTrace</h1>
      <p class="hint">Scan with your phone camera — it will open in the browser.</p>
      <div class="card">
        <img src="/dev-qr.png" width="260" height="260" alt="QR code opens FinTrace in your browser" />
        <p class="hint" style="color:#666;margin-top:1rem">Same Wi‑Fi as this computer</p>
        <p><a id="link" href="http://192.168.1.77:3000">http://192.168.1.77:3000</a></p>
      </div>
    </main>
  </body>
</html>
