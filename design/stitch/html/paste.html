</div>
<button class="text-primary dark:text-primary-fixed hover:bg-surface-container-high dark:hover:bg-surface-container-highest transition-colors p-2 rounded-full active:scale-95 transition-transform" data-icon="settings">
<span class="material-symbols-outlined">settings</span>
</button>
</div>
</header>
<main class="flex-grow w-full max-w-3xl mx-auto px-margin py-lg flex flex-col gap-lg">
<!-- Header Text -->
<div class="flex flex-col gap-xs">
<h2 class="font-headline-md text-headline-md text-on-surface">Paste SMS</h2>
<p class="font-body-md text-body-md text-on-surface-variant">Paste your payment message below to automatically track your spending.</p>
</div>
<!-- Input Area -->
<div class="flex flex-col gap-sm">
<label class="font-label-md text-label-md text-on-surface font-semibold" for="sms-input">SMS Message</label>
<textarea class="w-full p-md rounded-lg border border-outline-variant/20 bg-surface-container-low text-on-surface font-body-md focus:border-primary focus:ring-1 focus:ring-primary transition-colors resize-none" id="sms-input" placeholder="Example: You have sent 15,500 RWF to Kimironko Market..." rows="6"></textarea>
</div>
<!-- Preview Section (Hidden by default, shown via JS for demo) -->
<div class="flex flex-col gap-sm opacity-50 transition-opacity duration-300" id="preview-section">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Transaction Preview</h3>
<div class="bg-surface-container rounded-[16px] p-margin border border-outline-variant/30 flex flex-col gap-md">
<div class="flex justify-between items-start">
<div>
<p class="font-label-md text-label-md text-on-surface-variant mb-1">Amount</p>
<p class="font-headline-lg text-headline-lg text-primary">15,500 RWF</p>
</div>
<span class="material-symbols-outlined text-primary-container text-4xl" data-weight="fill" style="font-variation-settings: 'FILL' 1;">payments</span>
</div>
<div class="grid grid-cols-2 gap-md">
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Type</p>
<p class="font-body-lg text-body-lg text-on-surface">Payment</p>
</div>
<div>
<p class="font-label-md text-label-md text-on-surface-variant">Merchant</p>
<p class="font-body-lg text-body-lg text-on-surface">Kimironko Market</p>
</div>
</div>
<div class="pt-sm mt-sm border-t border-outline-variant/20">
<p class="font-label-md text-label-md text-on-surface-variant mb-2">Suggested Category</p>
<div class="inline-flex items-center gap-2 bg-tertiary-fixed text-on-tertiary-fixed-variant px-4 py-2 rounded-full font-label-md text-label-md">
<span class="material-symbols-outlined text-sm">shopping_cart</span>
                         Groceries
                     </div>
</div>
</div>

</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant px-4 py-1 hover:bg-secondary-container dark:hover:bg-secondary-fixed-dim transition-colors rounded-xl group active:scale-90 duration-150" href="#">
<span class="material-symbols-outlined mb-1 group-hover:text-primary-container" data-icon="insights">insights</span>
<span class="font-label-md text-label-md text-xs group-hover:text-primary-container">Insights</span>
</a>

<script>
        // Simple interaction to simulate preview appearing when text is entered
        const textarea = document.getElementById('sms-input');
        const preview = document.getElementById('preview-section');

        textarea.addEventListener('input', function() {
            if (this.value.length > 10) {
                preview.classList.remove('opacity-50');
                preview.classList.add('opacity-100');
            } else {
                preview.classList.add('opacity-50');
                preview.classList.remove('opacity-100');
            }
        });
    </script>
